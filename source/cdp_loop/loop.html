<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// CDP Booth Loop v6: white, motion-graphics rebuild of storyboard v5.
// renderFrame(t) draws the frame at time t (seconds, 0..90). Loops seamlessly.
const W = 1920, H = 1080, LOOP = 90;
// ?scale=2 renders natively at 3840 x 2160 (4K UHD); layout stays in 1920 x 1080 units
const SC = Number(new URLSearchParams(location.search).get('scale') || 1);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W * SC; cv.height = H * SC;
const C = {
  blue: '#0088cf', red: '#ee2424', navy: '#30267b',
  ink: '#1b2140', body: '#4a5470', mute: '#8b94aa', faint: '#c9d1de',
  line: '#e4e9f1', panel: '#f5f8fc', tint: '#e8f4fb',
};
const F = 'Inter', FD = 'Inter Display', FM = 'JetBrains Mono';

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = t => 1 - Math.pow(1 - t, 3);
const eOut5 = t => 1 - Math.pow(1 - t, 5);
const eExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const bump = (t, a, d) => { const p = (t - a) / d; return p <= 0 || p >= 1 ? 0 : Math.sin(Math.PI * p); };
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return `rgba(${r},${g},${b},${a})`; }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function shadow(blur = 30, oy = 10, a = 0.10) { ctx.shadowColor = `rgba(24,40,90,${a})`; ctx.shadowBlur = blur * SC; ctx.shadowOffsetY = oy * SC; }
function noShadow() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function card(x, y, w, h, r = 18, o = {}) {
  ctx.save(); shadow(o.blur ?? 34, o.oy ?? 12, o.sa ?? 0.10);
  rr(x, y, w, h, r); ctx.fillStyle = o.fill || '#fff'; ctx.fill(); noShadow();
  if (o.stroke !== null) { ctx.lineWidth = o.lw || 1.5; ctx.strokeStyle = o.stroke || C.line; ctx.stroke(); }
  ctx.restore();
}
function font(size, weight = 600, fam = F) { ctx.font = `${weight} ${size}px "${fam}"`; }
function txt(s, x, y, size, color, o = {}) {
  font(size, o.w ?? 600, o.f ?? F); ctx.fillStyle = color; ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'middle'; ctx.letterSpacing = (o.ls || 0) + 'px'; ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}
function tw(s, size, w = 600, fam = F, ls = 0) { font(size, w, fam); ctx.letterSpacing = ls + 'px'; const m = ctx.measureText(s).width; ctx.letterSpacing = '0px'; return m; }
function chip(x, y, label, o = {}) { // x,y = left-middle; returns width
  const size = o.size || 20, padX = o.pad || 18, h = o.h || size * 2, icon = o.icon ? h * 0.75 : 0;
  const w = tw(label, size, o.w || 700) + padX * 2 + icon;
  ctx.save(); if (o.shadow !== false) shadow(16, 6, 0.10);
  rr(x, y - h / 2, w, h, h / 2); ctx.fillStyle = o.fill || C.blue; ctx.fill(); noShadow();
  if (o.stroke) { ctx.lineWidth = 2; ctx.strokeStyle = o.stroke; ctx.stroke(); }
  if (o.icon) o.icon(x + padX + icon * 0.32, y, h * 0.42, o.color || '#fff');
  txt(label, x + padX + icon, y + 1, size, o.color || '#fff', { w: o.w || 700 });
  ctx.restore(); return w;
}
function check(cx, cy, s, color, p = 1, lw) { // check mark, p = draw progress
  const pts = [[-0.42, 0.02], [-0.12, 0.32], [0.45, -0.3]];
  const L1 = Math.hypot(0.3, 0.3), L2 = Math.hypot(0.57, 0.62), L = (L1 + L2) * p;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw || s * 0.16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx + pts[0][0] * s, cy + pts[0][1] * s);
  if (L <= L1) { const k = L / L1; ctx.lineTo(cx + lerp(pts[0][0], pts[1][0], k) * s, cy + lerp(pts[0][1], pts[1][1], k) * s); }
  else { ctx.lineTo(cx + pts[1][0] * s, cy + pts[1][1] * s); const k = (L - L1) / L2; ctx.lineTo(cx + lerp(pts[1][0], pts[2][0], k) * s, cy + lerp(pts[1][1], pts[2][1], k) * s); }
  if (p > 0) ctx.stroke(); ctx.restore();
}
function checkBadge(cx, cy, r, p, color = C.blue) {
  if (p <= 0) return; const s = eBack(clamp(p * 1.6));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); shadow(14, 5, 0.18);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); noShadow(); ctx.restore();
  check(cx, cy, r * 1.15, '#fff', eOut(prog(p, 0.35, 0.65)), r * 0.22);
}
function lock(cx, cy, s, color) {
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = s * 0.14;
  ctx.beginPath(); ctx.arc(cx, cy - s * 0.12, s * 0.28, Math.PI, 0); ctx.stroke();
  rr(cx - s * 0.42, cy - s * 0.12, s * 0.84, s * 0.62, s * 0.12); ctx.fill(); ctx.restore();
}

// ---------- icons (stroke style, cx/cy centre, s = size) ----------
const ICON = {
  archive(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .08; ctx.lineJoin = 'round';
    rr(cx - s * .45, cy - s * .38, s * .9, s * .24, s * .05); ctx.stroke(); rr(cx - s * .38, cy - s * .14, s * .76, s * .52, s * .05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * .12, cy + .02 * s); ctx.lineTo(cx + s * .12, cy + .02 * s); ctx.stroke(); },
  power(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .09; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy + s * .04, s * .36, -Math.PI / 2 + .7, -Math.PI / 2 - .7 + Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - s * .44); ctx.lineTo(cx, cy - s * .02); ctx.stroke(); },
  file(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .08; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cx - s * .32, cy - s * .44); ctx.lineTo(cx + s * .12, cy - s * .44); ctx.lineTo(cx + s * .34, cy - s * .22); ctx.lineTo(cx + s * .34, cy + s * .44); ctx.lineTo(cx - s * .32, cy + s * .44); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * .16, cy); ctx.lineTo(cx + s * .18, cy); ctx.moveTo(cx - s * .16, cy + s * .18); ctx.lineTo(cx + s * .18, cy + s * .18); ctx.stroke(); },
  mail(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .08; ctx.lineJoin = 'round';
    rr(cx - s * .45, cy - s * .32, s * .9, s * .64, s * .08); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * .4, cy - s * .24); ctx.lineTo(cx, cy + s * .06); ctx.lineTo(cx + s * .4, cy - s * .24); ctx.stroke(); },
  shield(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .08; ctx.lineJoin = 'round'; shieldPath(cx, cy, s * .9); ctx.stroke(); check(cx, cy + s * .02, s * .42, c, 1, s * .08); },
  mask(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .08; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx - s * .08, cy - s * .08, s * .28, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + s * .13, cy + s * .13); ctx.lineTo(cx + s * .4, cy + s * .4); ctx.stroke();
    ctx.fillStyle = c; for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(cx - s * .08 + i * s * .12, cy - s * .08, s * .04, 0, 7); ctx.fill(); } },
  lake(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .08;
    ctx.beginPath(); ctx.ellipse(cx, cy - s * .3, s * .38, s * .12, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * .38, cy - s * .3); ctx.lineTo(cx - s * .38, cy + s * .3); ctx.ellipse(cx, cy + s * .3, s * .38, s * .12, 0, Math.PI, 0, true); ctx.lineTo(cx + s * .38, cy - s * .3); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx, cy, s * .38, s * .12, 0, 0, Math.PI); ctx.stroke(); },
  ai(cx, cy, s, c) { ctx.fillStyle = c; const star = (x, y, r) => { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill(); };
    star(cx - s * .08, cy + s * .05, s * .38); star(cx + s * .3, cy - s * .3, s * .16); },
  search(cx, cy, s, c) { ctx.strokeStyle = c; ctx.lineWidth = s * .1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx - s * .08, cy - s * .08, s * .3, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(cx + s * .15, cy + s * .15); ctx.lineTo(cx + s * .42, cy + s * .42); ctx.stroke(); },
};
const TABS = ['Active Archive', 'Retire', 'Files', 'Email', 'Privacy', 'Discover & Mask', 'Data Lake+', 'AI-Activate Data'];
const TAB_ICONS = ['archive', 'power', 'file', 'mail', 'shield', 'mask', 'lake', 'ai'];
function shieldPath(cx, cy, s) {
  ctx.beginPath(); ctx.moveTo(cx, cy - s * .5);
  ctx.bezierCurveTo(cx + s * .22, cy - s * .38, cx + s * .4, cy - s * .36, cx + s * .42, cy - s * .34);
  ctx.bezierCurveTo(cx + s * .44, cy + s * .05, cx + s * .3, cy + s * .34, cx, cy + s * .52);
  ctx.bezierCurveTo(cx - s * .3, cy + s * .34, cx - s * .44, cy + s * .05, cx - s * .42, cy - s * .34);
  ctx.bezierCurveTo(cx - s * .4, cy - s * .36, cx - s * .22, cy - s * .38, cx, cy - s * .5); ctx.closePath();
}

// ---------- assets ----------
const IMG = {};
function loadImg(k, src) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.src = src; }); }

// ---------- background: white + periodic tech network ----------
const NET = (() => {
  const R = rng(7), nodes = [], edges = [];
  // jittered grid so the network covers the canvas evenly
  const cols = 13, rows = 8;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const x = (i + 0.5 + (R() - .5) * .8) * W / cols, y = (j + 0.5 + (R() - .5) * .8) * H / rows;
    nodes.push({ x, y, ax: 10 + R() * 22, ay: 10 + R() * 22, kx: 1 + Math.floor(R() * 3), ky: 1 + Math.floor(R() * 3),
      px: R() * 6.28, py: R() * 6.28, r: 2 + R() * 3.2, red: R() < 0.18, tw: Math.floor(R() * 6) + 2, tp: R() * 6.28 });
  }
  for (let a = 0; a < nodes.length; a++) {
    const d = nodes.map((n, b) => [Math.hypot(n.x - nodes[a].x, n.y - nodes[a].y), b]).sort((p, q) => p[0] - q[0]);
    for (let k = 1; k <= 3; k++) { const b = d[k][1]; if (d[k][0] < 260 && !edges.some(e => (e[0] === b && e[1] === a))) edges.push([a, b]); }
  }
  const pulses = [];
  for (let i = 0; i < 26; i++) pulses.push({ e: Math.floor(R() * edges.length), k: 3 + Math.floor(R() * 6), ph: R(), red: R() < 0.3, dir: R() < .5 });
  return { nodes, edges, pulses };
})();
function netPos(n, t) {
  const w = 2 * Math.PI * t / LOOP;
  return [n.x + n.ax * Math.sin(w * n.kx + n.px), n.y + n.ay * Math.sin(w * n.ky + n.py)];
}
// fade the network where text and visuals sit so content stays readable
function netMask(x, y) {
  if (y < 250) return 0.55;                      // behind header/banner
  if (y > 975) return 0.6;                       // behind footer
  const left = x < 960 ? 0.22 : 0.42;            // text column vs visual column
  const edge = Math.max(clamp((80 - x) / 80), clamp((x - 1840) / 80));
  return lerp(left, 1, edge);
}
function drawBackground(t) {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const w = 2 * Math.PI * t / LOOP;
  // soft colour washes (periodic drift)
  const blob = (x, y, r, col, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
  blob(1650 + 80 * Math.sin(w), 300 + 60 * Math.cos(w), 700, C.blue, 0.07);
  blob(250 + 70 * Math.cos(w * 2), 950 + 40 * Math.sin(w), 600, C.red, 0.045);
  blob(1100 + 90 * Math.sin(w * 3 + 1), 1000, 500, C.navy, 0.035);
  // dot grid
  ctx.fillStyle = 'rgba(48,38,123,0.06)';
  for (let y = 26; y < H; y += 44) for (let x = 26; x < W; x += 44) ctx.fillRect(x, y, 2, 2);
  const P = NET.nodes.map(n => netPos(n, t));
  ctx.lineWidth = 1.2;
  for (const [a, b] of NET.edges) {
    const [x1, y1] = P[a], [x2, y2] = P[b];
    const m = netMask((x1 + x2) / 2, (y1 + y2) / 2);
    const red = NET.nodes[a].red && NET.nodes[b].red;
    ctx.strokeStyle = rgba(red ? C.red : C.blue, 0.22 * m);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  for (const p of NET.pulses) {
    const [a, b] = NET.edges[p.e]; let f = (t / LOOP * p.k + p.ph) % 1; if (p.dir) f = 1 - f;
    const [x1, y1] = P[a], [x2, y2] = P[b], x = lerp(x1, x2, f), y = lerp(y1, y2, f);
    const m = netMask(x, y), col = p.red ? C.red : C.blue, a2 = Math.sin(Math.PI * f) * m;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 14); g.addColorStop(0, rgba(col, 0.55 * a2)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.fillRect(x - 14, y - 14, 28, 28);
    ctx.fillStyle = rgba(col, 0.9 * a2); ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
  }
  NET.nodes.forEach((n, i) => {
    const [x, y] = P[i], m = netMask(x, y), col = n.red ? C.red : C.blue;
    const tw = 0.5 + 0.5 * Math.sin(w * n.tw + n.tp);
    ctx.fillStyle = rgba(col, (0.10 + 0.12 * tw) * m); ctx.beginPath(); ctx.arc(x, y, n.r * 2.6, 0, 7); ctx.fill();
    ctx.fillStyle = rgba(col, 0.55 * m); ctx.beginPath(); ctx.arc(x, y, n.r, 0, 7); ctx.fill();
  });
}

// ---------- scenes (timings from storyboard v5) ----------
// headline markup: [b:..] blue, [r:..] red, [n:..] navy (default ink is navy-dark)
const S = [
  { t0: 0, d: 7, tab: -1, kick: 'SOLIX COMMON DATA PLATFORM', head: 'One platform for [b:all data], through the [r:lifecycle].', sub: 'Solix Common Data Platform', vis: visIntro },
  { t0: 7, d: 8, tab: 0, kick: '01  ACTIVE ARCHIVE', head: 'Lighter production. | [b:Nothing lost.]', sub: 'Archive inactive data on policy and keep it within reach.', vis: visArchive },
  { t0: 15, d: 8, tab: 1, kick: '02  RETIRE', head: '[r:Retire] the app. | [b:Keep the data.]', sub: 'Every record stays governed, legal-hold ready and searchable.', vis: visRetire },
  { t0: 23, d: 8, tab: 2, kick: '03  FILES', head: 'Bring dark file data [b:into the light]', sub: 'Archive file servers and classify content with your own taxonomy', vis: visFiles },
  { t0: 31, d: 8, tab: 3, kick: '04  EMAIL', head: 'Email, [b:archived] and [n:governed.]', sub: 'Exchange, Office 365, Gmail and PST files in one archive, from retention and legal hold to eDiscovery and defensible disposition.', vis: visEmail, subSize: 28 },
  { t0: 39, d: 8, tab: 4, kick: '05  PRIVACY', head: '[b:Privacy] built into the data estate', sub: 'GDPR · CCPA · LGPD · NYDFS · HIPAA', subNavy: true, vis: visPrivacy },
  { t0: 47, d: 8, tab: 5, kick: '06  DISCOVER & MASK', head: '[r:Find] sensitive data. | [b:Mask it.]', sub: 'Static and dynamic masking, plus unstructured redaction. Format and referential integrity kept.', vis: visMask },
  { t0: 55, d: 8, tab: 6, kick: '07  DATA LAKE+', head: '[b:Unified data] for analytics, governance and compliance', sub: 'Structured, semi-structured and unstructured data in one governed store', vis: visLake, headSize: 74 },
  { t0: 63, d: 9, tab: -1, gov: true, kick: 'BUILT-IN GOVERNANCE', head: '[b:Governed] from the day data lands', sub: 'The same controls apply across every capability', vis: visGoverned },
  { t0: 72, d: 10, tab: 7, kick: '08  AI-ACTIVATE DATA', head: 'Ask in plain English. | [b:Get cited answers.]', sub: 'With Enterprise AI, grounded in an Application Knowledge Graph.', call: 'See it live at this stand', vis: visAI },
  { t0: 82, d: 8, tab: -1, kick: 'SEE IT LIVE', head: 'See [b:CDP] on your data', sub: 'Talk to our team at this stand', call: 'Scan for the Common Data Platform page', vis: visEnd },
];
function sceneAt(t) { for (let i = S.length - 1; i >= 0; i--) if (t >= S[i].t0) return i; return 0; }

// ---------- header, banner, governance bar, footer ----------
const BX = 80, BW = 1760, BY = 136, BH = 60, GAP = 10, TABW = (BW - GAP * 7) / 8, GY = 206, GH = 30;
function tabX(i) { return BX + i * (TABW + GAP); }
function tabLevel(sc, i) { // 0 dim, 1 soft-lit (covered), 2 active
  const s = S[sc]; if (s.tab < 0) return 1; if (i < s.tab) return 1; if (i === s.tab) return 2; return 0;
}
function drawHeader(t) {
  const lg = IMG.logo, lh = 54, lw = lg.width * lh / lg.height;
  ctx.drawImage(lg, 80, 44, lw, lh);
  ctx.fillStyle = C.faint; ctx.fillRect(80 + lw + 26, 50, 2, 42);
  txt('Common Data Platform', 80 + lw + 52, 72, 30, C.navy, { w: 700 });
  // right: live loop progress ring + label
  const p = t / LOOP;
  txt('EMPOWER 2026', 1840, 72, 18, C.mute, { w: 700, align: 'right', ls: 3 });
}
function drawBanner(t) {
  const sc = sceneAt(t), s = S[sc], lt = t - s.t0, prev = S[(sc + S.length - 1) % S.length];
  const k = eIO(prog(lt, 0, 0.7));
  const prevSc = (sc + S.length - 1) % S.length;
  for (let i = 0; i < 8; i++) {
    let lv = lerp(tabLevel(prevSc, i), tabLevel(sc, i), k);
    // intro: each tab pulses blue in turn, left to right
    let pulse = sc === 0 ? bump(lt, 0.9 + i * 0.5, 0.9) : 0;
    const x = tabX(i), soft = clamp(lv), act = clamp(lv - 1);
    const bg = mix('#f3f5f9', '#e6f3fb', soft), fg0 = mix('#a6aec0', C.blue, soft);
    ctx.save();
    rr(x, BY, TABW, BH, 12); ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(C.blue, 0.10 + 0.25 * soft); ctx.stroke();
    const hl = Math.max(act, pulse * 0.9);
    if (hl > 0.001) {
      ctx.globalAlpha = hl; shadow(22, 8, 0.25 * hl); ctx.shadowColor = rgba(C.blue, 0.35 * hl);
      const g = ctx.createLinearGradient(x, BY, x, BY + BH); g.addColorStop(0, '#12a0e6'); g.addColorStop(1, C.blue);
      rr(x, BY, TABW, BH, 12); ctx.fillStyle = g; ctx.fill(); noShadow(); ctx.globalAlpha = 1;
    }
    const fg = mix(hex2rgbStr(fg0), '#ffffff', hl);
    // icon + label
    const lw = tw(TABS[i], 19, 700), iw = 26, tot = iw + 10 + lw, sx = x + TABW / 2 - tot / 2;
    ctx.save(); ICON[TAB_ICONS[i]](sx + iw / 2, BY + BH / 2, iw, fg); ctx.restore();
    txt(TABS[i], sx + iw + 10, BY + BH / 2 + 1, 19, fg, { w: 700 });
    // red underline on the active tab
    if (act > 0.001) { const uw = (TABW - 36) * eOut(act); ctx.fillStyle = C.red; rr(x + TABW / 2 - uw / 2, BY + BH - 6, uw, 4, 2); ctx.fill(); }
    ctx.restore();
  }
  // governance bar
  const govNow = s.gov ? 1 : 0, govPrev = prev.gov ? 1 : 0, g = lerp(govPrev, govNow, eIO(prog(lt, 0.2, 0.8)));
  ctx.save();
  rr(BX, GY, BW, GH, 8); ctx.fillStyle = mix('#eef1f6', C.blue, g); ctx.fill();
  if (g > 0) { // light sweep while lit

    nodes.forEach(([x, y], i) => glowDot(x, y, 7, i % 2 ? C.red : C.blue, 1));
    ctx.restore();
  }
}

// 11 · See CDP
function visEnd(lt) {
  const cx = 1420, cy = 590, s = 380;
  const p = enter(lt, 0.3, 0.9);
  ctx.save(); ctx.globalAlpha *= p; ctx.translate(cx, cy); ctx.scale(lerp(0.85, 1, p), lerp(0.85, 1, p)); ctx.translate(-cx, -cy);
  card(cx - s / 2 - 34, cy - s / 2 - 34, s + 68, s + 68, 30, { blur: 50, oy: 18, sa: 0.16 });
  ctx.imageSmoothingEnabled = false; ctx.drawImage(IMG.qr, cx - s / 2, cy - s / 2, s, s); ctx.imageSmoothingEnabled = true;
  ctx.restore();
  // corner brackets
  const bp = eOut5(prog(lt, 0.9, 0.8)), off = lerp(90, 0, bp) + 4 * Math.sin(lt * 3), d = s / 2 + 60 + off, L = 56;
  ctx.save(); ctx.globalAlpha *= bp; ctx.lineWidth = 7; ctx.lineCap = 'round';
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy], i) => {
    ctx.strokeStyle = i % 2 ? C.red : C.blue;
    ctx.beginPath(); ctx.moveTo(cx + sx * d, cy + sy * (d - L)); ctx.lineTo(cx + sx * d, cy + sy * d); ctx.lineTo(cx + sx * (d - L), cy + sy * d); ctx.stroke();
  });
  ctx.restore();
  // scan line sweeping the code
  const sp = prog(lt, 1.6, 3.2), sa = Math.sin(Math.PI * sp);
  if (sp > 0 && sp < 1) {
    const f = 0.5 - 0.5 * Math.cos(sp * Math.PI * 3), y = cy - s / 2 + f * s;
    const g = ctx.createLinearGradient(0, y - 40, 0, y + 40); g.addColorStop(0, rgba(C.red, 0)); g.addColorStop(.5, rgba(C.red, 0.18 * sa)); g.addColorStop(1, rgba(C.red, 0));
    ctx.fillStyle = g; ctx.fillRect(cx - s / 2 - 10, y - 40, s + 20, 80);
    ctx.fillStyle = rgba(C.red, 0.85 * sa); ctx.fillRect(cx - s / 2 - 10, y - 1.5, s + 20, 3);
  }
  const up = enter(lt, 1.2, 0.7);
  ctx.save(); ctx.globalAlpha *= up; ctx.translate(0, 16 * (1 - up));
  label('solix.com', cx, cy + s / 2 + 130, 34, C.navy, { w: 800, f: FD }); ctx.restore();
}

// ---------- transition flourish at each scene boundary ----------
function drawTransition(t) {
  // find nearest boundary (including the loop seam at 0/90)
  let best = 1e9, bt = 0;
  for (const s of S) for (const b of [s.t0, s.t0 + LOOP, s.t0 - LOOP]) if (Math.abs(t - b) < Math.abs(best)) { best = t - b; bt = b; }
  const p = (best + 0.35) / 0.9; if (p <= 0 || p >= 1) return;
  const e = eIO(p), x = lerp(-300, W + 300, e), a = Math.sin(Math.PI * p);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 270, W, 700); ctx.clip();
  const g = ctx.createLinearGradient(x - 260, 0, x + 40, 0);
  g.addColorStop(0, rgba(C.blue, 0)); g.addColorStop(0.7, rgba(C.blue, 0.10 * a)); g.addColorStop(1, rgba(C.blue, 0));
  ctx.fillStyle = g; ctx.fillRect(x - 260, 270, 300, 700);
  ctx.fillStyle = rgba(C.blue, 0.55 * a); ctx.fillRect(x, 270, 3, 700);
  ctx.fillStyle = rgba(C.red, 0.55 * a); ctx.fillRect(x - 26, 270, 2, 700);
  ctx.restore();
}

// ---------- frame ----------
function renderFrame(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  drawBackground(t);
  const sc = sceneAt(t), s = S[sc], lt = t - s.t0;
  visWrap(s, lt, s.vis);
  drawText(s, lt);
  drawTransition(t);
  drawHeader(t); drawBanner(t); drawFooter(t);
}
window.renderFrame = renderFrame;

  for (const f of ['800 78px "Inter Display"', '700 20px "Inter"', '600 20px "Inter"', '500 20px "Inter"', '800 20px "Inter"', '600 20px "JetBrains Mono"', '800 20px "JetBrains Mono"']) await document.fonts.load(f);
  renderFrame(0); return true;
})();
